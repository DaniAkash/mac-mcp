name: PR checks

# Runs the same root-level scripts a contributor would run locally:
#   bun run check  (vp lint + vp fmt --check + fallow check, in parallel)
#   bun run test   (bun's test runner; supports bun:sqlite natively)
#
# Both jobs run in parallel so a lint failure does not gate the test signal
# and vice versa. Concurrency cancels superseded runs on a force-push.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint + format + fallow
        run: bun run check

  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
